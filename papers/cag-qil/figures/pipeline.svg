<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 540" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fa3b3"/></marker><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aacb6"/></marker></defs><rect x="0" y="0" width="1120" height="540" fill="#ffffff"/><rect x="30" y="40" width="290" height="108" rx="10" fill="#ffffff" stroke="#cfdde3" stroke-width="1.5"/><text x="46" y="59" font-size="12" fill="#087d86" letter-spacing="1">INPUT</text><text x="46" y="80" font-size="18.5" font-weight="bold" fill="#123c5b">流式视频特征</text><text x="46" y="102" font-size="15" fill="#3d5a6b">每 6 帧一块 → 特征 f_t</text><text x="46" y="122" font-size="15" fill="#3d5a6b">块内首帧作为候选边界</text><rect x="360" y="40" width="300" height="95" rx="10" fill="#ffffff" stroke="#cfdde3" stroke-width="1.5"/><text x="376" y="67" font-size="18.5" font-weight="bold" fill="#123c5b">双流 TSN 编码 E</text><text x="376" y="89" font-size="15" fill="#3d5a6b">Kinetics 预训练，冻结</text><text x="376" y="109" font-size="15" fill="#3d5a6b">块长 k=6，边界分辨率固定</text><rect x="700" y="40" width="390" height="128" rx="10" fill="#ecf8f7" stroke="#8fc9cd" stroke-width="1.5"/><text x="716" y="59" font-size="12" fill="#087d86" letter-spacing="1">SCORE</text><text x="716" y="80" font-size="18.5" font-weight="bold" fill="#123c5b">OAD 双头（第二阶段冻结）</text><text x="716" y="102" font-size="15" fill="#3d5a6b">M1 → actionness α_t</text><text x="716" y="122" font-size="15" fill="#3d5a6b">M2 → 类别分布 p_t</text><text x="716" y="142" font-size="15" fill="#3d5a6b">一层 LSTM + 两层 FC，逐块推理</text><line x1="320" y1="86" x2="356" y2="86" stroke="#7fa3b3" stroke-width="1.8" marker-end="url(#a)"/><line x1="660" y1="86" x2="696" y2="86" stroke="#7fa3b3" stroke-width="1.8" marker-end="url(#a)"/><rect x="345" y="176" width="430" height="148" rx="10" fill="#ecf8f7" stroke="#8fc9cd" stroke-width="1.5"/><text x="361" y="195" font-size="12" fill="#087d86" letter-spacing="1">AGENT</text><text x="361" y="216" font-size="18.5" font-weight="bold" fill="#123c5b">CAG agent：状态 = 三条定长队列</text><text x="361" y="238" font-size="15" fill="#3d5a6b">q_a = [α_{t−n} … α_t]　动作性历史</text><text x="361" y="258" font-size="15" fill="#3d5a6b">q_d = [d_{t−n−1} … d_{t−1}]　决策历史</text><text x="361" y="278" font-size="15" fill="#3d5a6b">p_t　当前类别分布</text><text x="361" y="298" font-size="15" fill="#3d5a6b">2×FC + LeakyReLU → d_t ∈ {0,1}</text><path d="M895,132 L895,155 L760,155 L760,172" fill="none" stroke="#7fa3b3" stroke-width="1.8" marker-end="url(#a)"/><path d="M775,300 Q830,255 775,206" fill="none" stroke="#9aacb6" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ad)"/><text x="836" y="262" font-size="12.5" fill="#3d5a6b" text-anchor="start">d_t 回写 q_d</text><text x="836" y="278" font-size="12.5" fill="#3d5a6b" text-anchor="start">每步出队入队一次</text><rect x="30" y="386" width="330" height="128" rx="10" fill="#ecf8f7" stroke="#8fc9cd" stroke-width="1.5"/><text x="46" y="405" font-size="12" fill="#087d86" letter-spacing="1">DECISION</text><text x="46" y="426" font-size="18.5" font-weight="bold" fill="#123c5b">边沿触发提交</text><text x="46" y="448" font-size="15" fill="#3d5a6b">d 由 0 变 1：记起点 s</text><text x="46" y="468" font-size="15" fill="#3d5a6b">d 由 1 变 0：记终点 e，提交</text><text x="46" y="488" font-size="15" fill="#3d5a6b">边界取翻转块首帧，只能落在 6 帧网格</text><rect x="400" y="386" width="290" height="95" rx="10" fill="#ffffff" stroke="#cfdde3" stroke-width="1.5"/><text x="416" y="413" font-size="18.5" font-weight="bold" fill="#123c5b">TSM 分类器 C</text><text x="416" y="435" font-size="15" fill="#3d5a6b">只对已结束的 x_{s:e} 打分</text><text x="416" y="455" font-size="15" fill="#3d5a6b">类别在提交那一刻才确定</text><rect x="730" y="386" width="360" height="108" rx="10" fill="#ffffff" stroke="#cfdde3" stroke-width="1.5"/><text x="746" y="405" font-size="12" fill="#087d86" letter-spacing="1">OUTPUT</text><text x="746" y="426" font-size="18.5" font-weight="bold" fill="#123c5b">Ψ 已提交实例</text><text x="746" y="448" font-size="15" fill="#3d5a6b">(s, e, 类别)</text><text x="746" y="468" font-size="15" fill="#3d5a6b">提交后不可回改</text><path d="M420,340 L420,356 L195,356 L195,382" fill="none" stroke="#7fa3b3" stroke-width="1.8" marker-end="url(#a)"/><line x1="360" y1="444" x2="396" y2="444" stroke="#7fa3b3" stroke-width="1.8" marker-end="url(#a)"/><line x1="690" y1="444" x2="726" y2="444" stroke="#7fa3b3" stroke-width="1.8" marker-end="url(#a)"/></svg>