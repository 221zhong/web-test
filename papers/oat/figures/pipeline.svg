<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fa3b3"/></marker><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aacb6"/></marker></defs><rect x="0" y="0" width="1120" height="520" fill="#ffffff"/><rect x="30" y="40" width="300" height="108" rx="10" fill="#ffffff" stroke="#cfdde3" stroke-width="1.5"/><text x="46" y="59" font-size="12" fill="#087d86" letter-spacing="1">INPUT</text><text x="46" y="80" font-size="18.5" font-weight="bold" fill="#123c5b">特征队列（滑动窗口）</text><text x="46" y="102" font-size="15" fill="#3d5a6b">长度 Lq，右端恒等于当前帧</text><text x="46" y="122" font-size="15" fill="#3d5a6b">每来新特征，窗口前移一格</text><rect x="370" y="40" width="300" height="95" rx="10" fill="#ffffff" stroke="#cfdde3" stroke-width="1.5"/><text x="386" y="67" font-size="18.5" font-weight="bold" fill="#123c5b">投影 + 位置编码</text><text x="386" y="89" font-size="15" fill="#3d5a6b">线性映射到 D=1024</text><text x="386" y="109" font-size="15" fill="#3d5a6b">加正弦位置编码</text><rect x="710" y="40" width="380" height="108" rx="10" fill="#ecf8f7" stroke="#8fc9cd" stroke-width="1.5"/><text x="726" y="59" font-size="12" fill="#087d86" letter-spacing="1">ENCODE</text><text x="726" y="80" font-size="18.5" font-weight="bold" fill="#123c5b">Encoder ×3（8 头）</text><text x="726" y="102" font-size="15" fill="#3d5a6b">得到队列级表示 E</text><text x="726" y="122" font-size="15" fill="#3d5a6b">Lq = 64 / 150 / 32，按数据集定</text><line x1="330" y1="86" x2="366" y2="86" stroke="#7fa3b3" stroke-width="1.8" marker-end="url(#a)"/><line x1="670" y1="86" x2="706" y2="86" stroke="#7fa3b3" stroke-width="1.8" marker-end="url(#a)"/><rect x="700" y="180" width="390" height="128" rx="10" fill="#ecf8f7" stroke="#8fc9cd" stroke-width="1.5"/><text x="716" y="199" font-size="12" fill="#087d86" letter-spacing="1">DECODE</text><text x="716" y="220" font-size="18.5" font-weight="bold" fill="#123c5b">Anchor query + Decoder ×5</text><text x="716" y="242" font-size="15" fill="#3d5a6b">K 个可学习 query，4 头 cross-attn</text><text x="716" y="262" font-size="15" fill="#3d5a6b">所有 anchor 的终点固定在当前帧</text><text x="716" y="282" font-size="15" fill="#3d5a6b">只按长度区分：{Lq/8, Lq/4, Lq/2, Lq}</text><rect x="370" y="180" width="300" height="115" rx="10" fill="#ffffff" stroke="#cfdde3" stroke-width="1.5"/><text x="386" y="207" font-size="18.5" font-weight="bold" fill="#123c5b">两个预测头</text><text x="386" y="229" font-size="15" fill="#3d5a6b">分类头：C+1 类（含背景）</text><text x="386" y="249" font-size="15" fill="#3d5a6b">边界头：终点偏移 + 长度比</text><text x="386" y="269" font-size="15" fill="#3d5a6b">按 anchor 长度归一化</text><rect x="30" y="180" width="310" height="108" rx="10" fill="#ffffff" stroke="#cfdde3" stroke-width="1.5"/><text x="46" y="199" font-size="12" fill="#087d86" letter-spacing="1">SUPPRESS 1</text><text x="46" y="220" font-size="18.5" font-weight="bold" fill="#123c5b">帧内 NMS</text><text x="46" y="242" font-size="15" fill="#3d5a6b">每步 K 条候选先剔除背景</text><text x="46" y="262" font-size="15" fill="#3d5a6b">只在已可见的候选之间比较</text><line x1="895" y1="132" x2="895" y2="176" stroke="#7fa3b3" stroke-width="1.8" marker-end="url(#a)"/><line x1="700" y1="239" x2="674" y2="239" stroke="#7fa3b3" stroke-width="1.8" marker-end="url(#a)"/><line x1="370" y1="239" x2="344" y2="239" stroke="#7fa3b3" stroke-width="1.8" marker-end="url(#a)"/><rect x="30" y="372" width="360" height="128" rx="10" fill="#ecf8f7" stroke="#8fc9cd" stroke-width="1.5"/><text x="46" y="391" font-size="12" fill="#087d86" letter-spacing="1">SUPPRESS 2</text><text x="46" y="412" font-size="18.5" font-weight="bold" fill="#123c5b">OSN 提交门控</text><text x="46" y="434" font-size="15" fill="#3d5a6b">proposal history qh ∈ [0,1]^(Lq×C)</text><text x="46" y="454" font-size="15" fill="#3d5a6b">FC-ReLU-FC-Sigmoid → s_t</text><text x="46" y="474" font-size="15" fill="#3d5a6b">s_t > θs = 0.1 时注册当前 proposal</text><rect x="430" y="372" width="310" height="108" rx="10" fill="#ffffff" stroke="#cfdde3" stroke-width="1.5"/><text x="446" y="391" font-size="12" fill="#087d86" letter-spacing="1">OUTPUT</text><text x="446" y="412" font-size="18.5" font-weight="bold" fill="#123c5b">Ψ 已提交实例</text><text x="446" y="434" font-size="15" fill="#3d5a6b">坐标本身已在全局时间轴上</text><text x="446" y="454" font-size="15" fill="#3d5a6b">IoU > 0.3 的后续候选被屏蔽</text><rect x="770" y="372" width="320" height="128" rx="10" fill="#ffffff" stroke="#cfdde3" stroke-width="1.5"/><text x="786" y="391" font-size="12" fill="#087d86" letter-spacing="1">LATENCY</text><text x="786" y="412" font-size="18.5" font-weight="bold" fill="#123c5b">三处延迟来源</text><text x="786" y="434" font-size="15" fill="#3d5a6b">上下文不足时 anchor 匹配不上</text><text x="786" y="454" font-size="15" fill="#3d5a6b">OSN 为更准候选主动推迟</text><text x="786" y="474" font-size="15" fill="#3d5a6b">特征编码开销</text><line x1="90" y1="298" x2="90" y2="368" stroke="#7fa3b3" stroke-width="1.8" marker-end="url(#a)"/><line x1="390" y1="432" x2="426" y2="432" stroke="#7fa3b3" stroke-width="1.8" marker-end="url(#a)"/><path d="M600,372 L600,346 L250,346 L250,302" fill="none" stroke="#9aacb6" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ad)"/><text x="425" y="338" font-size="12.5" fill="#3d5a6b" text-anchor="middle">已注册集合回灌</text></svg>