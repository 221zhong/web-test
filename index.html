<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#12072f" />
    <title>给欣宝 💖</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="sky" aria-hidden="true"></canvas>
    <div class="aurora aurora-one" aria-hidden="true"></div>
    <div class="aurora aurora-two" aria-hidden="true"></div>

    <main class="card" id="questionCard">
      <div class="heart" aria-hidden="true">♥</div>
      <p class="for-you">TO 欣宝</p>
      <h1>你是臭宝吗？</h1>
      <p class="hint">要认真选择哦～</p>
      <div class="actions" id="actions">
        <button class="answer yes" id="yesButton" type="button">是</button>
        <button class="answer no" id="noButton" type="button">不是</button>
      </div>
    </main>

    <section class="surprise" id="surprise" aria-hidden="true">
      <div class="love-ring" aria-hidden="true"></div>
      <p class="love-title" aria-label="伦伦是老大">
        <span style="--i: 0">伦</span><span style="--i: 1">伦</span><span style="--i: 2">是</span><span style="--i: 3">老</span><span style="--i: 4">大</span>
      </p>
    </section>

    <script src="script.js"></script>
  </body>
</html>
